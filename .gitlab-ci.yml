stages: [test, build, deploy]

# ===== Global variables =====
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"
  BACKEND_IMAGE: "${CI_REGISTRY_IMAGE}/backend:${IMAGE_TAG}"
  FRONTEND_IMAGE: "${CI_REGISTRY_IMAGE}/frontend:${IMAGE_TAG}"

  # === Deploy target (Production) — override ได้ที่ Settings → CI/CD → Variables ===
  DEPLOY_HOST: "172.16.3.105"
  DEPLOY_PORT: "22"
  DEPLOY_USER: "ubuntu"
  DEPLOY_PATH: "/opt/pes"

default:
  tags: [docker]                   # ให้ตรงกับ Runner ของคุณ

# ===== TEST =====
# backend: unit test + integration test กับ MySQL จริง (โหลด schema.sql ก่อน)
test_backend:
  stage: test
  image: node:20-alpine
  services:
    - name: mysql:8.0
      alias: db
      command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
  variables:
    MYSQL_ROOT_PASSWORD: rootpassword
    MYSQL_DATABASE: skills_db
    DB_HOST: db
    DB_USER: root
    DB_PASSWORD: rootpassword
    DB_NAME: skills_db
    JWT_SECRET: ci-test-secret
  cache:
    key: backend-${CI_COMMIT_REF_SLUG}
    paths: [backend/node_modules]
  script:
    - apk add --no-cache mysql-client
    - for i in $(seq 1 30); do mysqladmin ping -h db -uroot -prootpassword --silent && break; sleep 2; done
    - mysql -h db -uroot -prootpassword --default-character-set=utf8mb4 < schema.sql
    - cd backend
    - npm ci
    - npm test
  rules:
    - changes: ["backend/**", "schema.sql"]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

test_frontend:
  stage: test
  image: node:20-alpine
  cache:
    key: frontend-${CI_COMMIT_REF_SLUG}
    paths: [frontend/node_modules]
  script:
    - cd frontend
    - npm ci
    - npm test
    - npm run build
  rules:
    - changes: ["frontend/**"]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ===== BUILD & PUSH (Docker-in-Docker) =====
.build_template:
  image: docker:26
  services:
    - docker:26-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin

build_backend:
  stage: build
  extends: .build_template
  needs: [{ job: test_backend, optional: true }]
  script:
    - docker build -t "$BACKEND_IMAGE" ./backend
    - docker push "$BACKEND_IMAGE"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$BACKEND_IMAGE" "${CI_REGISTRY_IMAGE}/backend:latest"
        docker push "${CI_REGISTRY_IMAGE}/backend:latest"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH
      changes: ["backend/**"]

build_frontend:
  stage: build
  extends: .build_template
  needs: [{ job: test_frontend, optional: true }]
  script:
    - docker build -t "$FRONTEND_IMAGE" ./frontend
    - docker push "$FRONTEND_IMAGE"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$FRONTEND_IMAGE" "${CI_REGISTRY_IMAGE}/frontend:latest"
        docker push "${CI_REGISTRY_IMAGE}/frontend:latest"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH
      changes: ["frontend/**"]

# ===== DEPLOY (SSH ไปเครื่องปลายทาง แล้ว docker compose) =====
deploy_prod:
  stage: deploy
  image: alpine:3.20
  needs: [{ job: build_backend, optional: true }, { job: build_frontend, optional: true }]
  environment:
    name: production
    url: http://$DEPLOY_HOST:3000
    on_stop: stop_prod
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$DEPLOY_PRIV_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - SSH="ssh -p $DEPLOY_PORT -i ~/.ssh/id_ed25519 ${DEPLOY_USER}@${DEPLOY_HOST}"
    - $SSH "mkdir -p $DEPLOY_PATH/deploy"
    - rsync -avz -e "ssh -p $DEPLOY_PORT -i ~/.ssh/id_ed25519" docker-compose.prod.yml schema.sql "${DEPLOY_USER}@${DEPLOY_HOST}:$DEPLOY_PATH/"
    - $SSH "echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' '$CI_REGISTRY' --password-stdin"
    - $SSH "cd $DEPLOY_PATH && REGISTRY_IMAGE='$CI_REGISTRY_IMAGE' IMAGE_TAG=latest docker compose -f docker-compose.prod.yml pull && REGISTRY_IMAGE='$CI_REGISTRY_IMAGE' IMAGE_TAG=latest docker compose -f docker-compose.prod.yml up -d --remove-orphans"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

stop_prod:
  stage: deploy
  image: alpine:3.20
  environment:
    name: production
    action: stop
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$DEPLOY_PRIV_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh -p "$DEPLOY_PORT" -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" "cd $DEPLOY_PATH && docker compose -f docker-compose.prod.yml down"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true

# =======================================================
# ก่อนกด Deploy ต้องมี:
# 1) GitLab Variables (protected): DEPLOY_PRIV_KEY = SSH private key ของผู้ใช้บนเครื่องปลายทาง
# 2) บนเครื่องปลายทาง: ติดตั้ง Docker + Compose plugin, ใส่ public key ใน ~/.ssh/authorized_keys
# 3) สร้างไฟล์ $DEPLOY_PATH/deploy/backend.env บนเครื่องปลายทาง (ดูตัวอย่าง deploy/backend.env.example)
# =======================================================
